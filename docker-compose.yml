version: '3.9'

services:

  # ── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fitzip-server
    networks:
      - fitzip-net
    restart: unless-stopped

  # ── Spring Boot API ────────────────────────────────────────
  fitzip-server:
    build:
      context: ./fitzip-server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://fitzip-ai:8000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fitzip-net
    restart: unless-stopped

  # ── Python AI Service (MediaPipe) ──────────────────────────
  fitzip-ai:
    build:
      context: ./fitzip-ai
      dockerfile: Dockerfile
    networks:
      - fitzip-net
    restart: unless-stopped

  # ── MySQL 8.0 ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fitzip-net
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fitzip-net
    restart: unless-stopped

  # ── Adminer (dev 전용 DB GUI) ──────────────────────────────
  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql
    networks:
      - fitzip-net
    profiles:
      - dev

volumes:
  mysql_data:
  redis_data:

networks:
  fitzip-net:
    driver: bridge
