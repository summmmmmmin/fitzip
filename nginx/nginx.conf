events {
    worker_connections 1024;
}

http {
    upstream api {
        server fitzip-server:8080;
    }

    upstream ai {
        server fitzip-ai:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Spring Boot API
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger UI (dev)
        location /swagger-ui/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # AI 서비스 내부용 (외부 직접 노출 X, Spring Boot가 호출)
        location /ai/ {
            proxy_pass http://ai/;
            proxy_set_header Host $host;
        }
    }
}
